<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Fashion</title>
<style>
    /* ================================
   RESET
================================ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #fff;
  color: #111;
}

/* ================================
   LAYOUT
================================ */
.container {
  width: 90%;
  margin: auto;
}

/* ================================
   HERO
================================ */
.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 40px 0;
  flex-wrap: wrap;
  gap: 20px;
}

.hero-text {
  flex: 1;
}

.hero-text h1 {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.hero-text p {
  font-size: 16px;
  color: #555;
}

.hero img {
  width: 300px;
  height: 370px;
  object-fit: cover;
  border-radius: 10px;
}

/* ================================
   GRID
================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin: 40px 0;
}

/* ================================
   CARDS
================================ */
.card {
  background: #f5f5f5;
  border-radius: 10px;
  overflow: hidden;
  text-align: center;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
}

.card p {
  padding: 10px;
  font-size: 13px;
  color: #666;
}

/* ================================
   SECTION
================================ */
.section {
  margin: 50px 0;
}

.section h2 {
  font-size: 22px;
  margin-bottom: 20px;
}

/* ================================
   BANNER
================================ */
.banner {
  background: #eee;
  padding: 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  border-radius: 15px;
}

.banner h2 {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 8px;
}

.banner p {
  color: #555;
}

.banner img {
  width: 200px;
  height: 250px;
  object-fit: cover;
  border-radius: 10px;
}

/* ================================
   RESPONSIVE
================================ */
@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .hero {
    flex-direction: column;
    text-align: center;
  }

  .hero img {
    margin-top: 20px;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <div class="hero-text">
      <h1>ULTIME COLLECTION</h1>
      <p>Nouvelle tendance 2026</p>
    </div>
    <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=600&q=80" alt="model">
  </section>
  <div class="grid">
    <div class="card"><img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=400&q=80" alt="mode"><p>Printemps</p></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=400&q=80" alt="style"><p>Urban</p></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400&q=80" alt="femme mode"><p>Chic</p></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=400&q=80" alt="streetwear"><p>Streetwear</p></div>
  </div>
  <section class="section">
    <h2>Trending</h2>
    <div class="grid">
      <div class="card"><img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=400&q=80" alt="tendance"><p>Été 2026</p></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=400&q=80" alt="fashion"><p>Luxe</p></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e?w=400&q=80" alt="style femme"><p>Editorial</p></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1475180098004-ca77a66827be?w=400&q=80" alt="mode homme"><p>Casual</p></div>
    </div>
  </section>
  <section class="banner">
    <div>
      <h2>High Fashion</h2>
      <p>Découvrez les nouveautés</p>
    </div>
    <img src="https://images.unsplash.com/photo-1542295669297-4d352b042bca?w=400&q=80" alt="high fashion">
  </section>
</div>
</body>
</html>
